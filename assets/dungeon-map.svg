<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Courier New, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="brick" width="46" height="24" patternUnits="userSpaceOnUse">
      <rect width="46" height="24" fill="#141414"/>
      <rect x="0" y="0" width="22" height="10" fill="#1c1c1c" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="24" y="0" width="22" height="10" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="-11" y="12" width="22" height="10" fill="#1b1b1b" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="13" y="12" width="22" height="10" fill="#191919" stroke="#0a0a0a" stroke-width="1"/>
      <rect x="35" y="12" width="22" height="10" fill="#1c1c1c" stroke="#0a0a0a" stroke-width="1"/>
    </pattern>
    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="plaque" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="620" fill="#0a0a0a"/>
  <rect width="1000" height="620" fill="url(#brick)" opacity="0.5"/>

  <!-- title plaque -->
  <rect x="220" y="18" width="560" height="54" rx="4" fill="url(#plaque)" stroke="#8a6d3b" stroke-width="2"/>
  <text x="500" y="53" text-anchor="middle" fill="#f2e8d5" font-size="22" letter-spacing="3" font-weight="bold">THE DUNGEON OF MAYANK SINGH</text>

  <!-- corridors -->
  <g stroke="#2c2c2c" stroke-width="22" fill="none">
    <path d="M500,120 L500,165"/>
    <path d="M500,205 L500,235 M500,235 L250,235 L250,275 M500,235 L500,275 M500,235 L750,235 L750,275"/>
    <path d="M250,365 L250,405 L470,405 L470,435 M500,365 L500,435 M750,365 L750,405 L530,405 L530,435"/>
    <path d="M500,505 L500,545"/>
  </g>
  <g stroke="#1c1c1c" stroke-width="4" fill="none" opacity="0.6">
    <path d="M500,120 L500,165"/>
    <path d="M500,205 L500,235 M500,235 L250,235 L250,275 M500,235 L500,275 M500,235 L750,235 L750,275"/>
    <path d="M250,365 L250,405 L470,405 L470,435 M500,365 L500,435 M750,365 L750,405 L530,405 L530,435"/>
    <path d="M500,505 L500,545"/>
  </g>

  <!-- ENTRANCE -->
  <g>
    <rect x="430" y="90" width="140" height="60" rx="3" fill="url(#brick)" stroke="#8a6d3b" stroke-width="3"/>
    <circle cx="500" cy="120" r="55" fill="url(#torchGlow)"/>
    <text x="500" y="124" text-anchor="middle" fill="#eae0c8" font-size="14" letter-spacing="2">ENTRANCE</text>
    <polygon points="500,100 494,108 506,108" fill="#ffb347"/>
  </g>

  <!-- HALL -->
  <g>
    <rect x="400" y="165" width="200" height="70" rx="3" fill="url(#brick)" stroke="#8a6d3b" stroke-width="3"/>
    <circle cx="500" cy="200" r="60" fill="url(#torchGlow)"/>
    <text x="500" y="196" text-anchor="middle" fill="#eae0c8" font-size="14" letter-spacing="2">THE HALL</text>
    <text x="500" y="216" text-anchor="middle" fill="#8f8f8f" font-size="11">bio &amp; class info</text>
  </g>

  <!-- ARMORY -->
  <g>
    <rect x="150" y="275" width="200" height="90" rx="3" fill="url(#brick)" stroke="#8a6d3b" stroke-width="3"/>
    <circle cx="250" cy="320" r="60" fill="url(#torchGlow)"/>
    <text x="250" y="308" text-anchor="middle" fill="#eae0c8" font-size="14" letter-spacing="2">ARMORY</text>
    <text x="250" y="328" text-anchor="middle" fill="#8f8f8f" font-size="11">tech stack</text>
    <!-- sword icon -->
    <g transform="translate(250,340)">
      <rect x="-2" y="-22" width="4" height="26" fill="#cfcfcf"/>
      <polygon points="0,-30 -6,-16 6,-16" fill="#e8e8e8"/>
      <rect x="-10" y="4" width="20" height="4" fill="#8a6d3b"/>
      <rect x="-2" y="8" width="4" height="10" fill="#5c4526"/>
    </g>
  </g>

  <!-- LIBRARY -->
  <g>
    <rect x="400" y="275" width="200" height="90" rx="3" fill="url(#brick)" stroke="#8a6d3b" stroke-width="3"/>
    <circle cx="500" cy="320" r="60" fill="url(#torchGlow)"/>
    <text x="500" y="308" text-anchor="middle" fill="#eae0c8" font-size="14" letter-spacing="2">LIBRARY</text>
    <text x="500" y="328" text-anchor="middle" fill="#8f8f8f" font-size="11">focus &amp; DSA</text>
    <!-- book icon -->
    <g transform="translate(500,343)">
      <path d="M-14,-8 L0,-13 L14,-8 L14,8 L0,3 L-14,8 Z" fill="#c79a49"/>
      <line x1="0" y1="-13" x2="0" y2="3" stroke="#5c4526" stroke-width="1.5"/>
    </g>
  </g>

  <!-- TREASURY -->
  <g>
    <rect x="650" y="275" width="200" height="90" rx="3" fill="url(#brick)" stroke="#8a6d3b" stroke-width="3"/>
    <circle cx="750" cy="320" r="60" fill="url(#torchGlow)"/>
    <text x="750" y="308" text-anchor="middle" fill="#eae0c8" font-size="14" letter-spacing="2">TREASURY</text>
    <text x="750" y="328" text-anchor="middle" fill="#8f8f8f" font-size="11">github stats</text>
    <!-- chest icon -->
    <g transform="translate(750,344)">
      <rect x="-14" y="-4" width="28" height="14" fill="#8a6d3b" stroke="#5c4526" stroke-width="1"/>
      <path d="M-14,-4 A14,10 0 0 1 14,-4" fill="none" stroke="#5c4526" stroke-width="2"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#ffd76a"/>
    </g>
  </g>

  <!-- BOSS CHAMBER -->
  <g>
    <rect x="400" y="435" width="200" height="70" rx="3" fill="url(#brick)" stroke="#b33" stroke-width="3"/>
    <circle cx="500" cy="468" r="65" fill="#b33333" opacity="0.18"/>
    <text x="500" y="464" text-anchor="middle" fill="#f2c9c9" font-size="14" letter-spacing="2">BOSS CHAMBER</text>
    <text x="500" y="484" text-anchor="middle" fill="#8f8f8f" font-size="11">links &amp; contact</text>
  </g>

  <!-- EXIT -->
  <g>
    <rect x="430" y="545" width="140" height="55" rx="3" fill="url(#brick)" stroke="#8a6d3b" stroke-width="3"/>
    <text x="500" y="578" text-anchor="middle" fill="#eae0c8" font-size="14" letter-spacing="2">EXIT</text>
  </g>

  <!-- vignette -->
  <rect width="1000" height="620" fill="url(#vignette)"/>
</svg>
